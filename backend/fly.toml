# fly.toml app configuration file generated for quant-stock-backend

app = "quant-stock-backend"
primary_region = "hkg" # 香港區域較近，您也可以改為其他如 nrt (東京) 或 tpe (台北)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATABASE_URL = "/data/quant.db"
  KLINE_DATA_SOURCE = "alpaca_iex"
  ALLOWED_ORIGINS = "*" # 預設允許所有，您也可以在 Vercel 部署完成後將其設定為您的 Vercel 專案網址

[[mounts]]
  source = "quant_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "5s"
    interval = "10s"
    method = "get"
    path = "/"
    protocol = "http"
    timeout = "2s"
